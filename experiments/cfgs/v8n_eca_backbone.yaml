# I3a：ECA 插在 backbone 三个输出 stage（P3/P4/P5）的 C2f 之后，共 3 处
# 层索引 0-25，Detect 取 18/21/24。width/depth 为 v8n 系数（0.25/0.33）
nc: 8
scales: {}   # 占位防止误用 scales；实际构建时由脚本删除并改用下方顶层系数
width_multiple: 0.25
depth_multiple: 0.33
max_channels: 1024

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1  P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3  P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, ECABlock, []]          # 5  ← ECA：backbone P3 C2f 后
  - [-1, 1, Conv, [512, 3, 2]]     # 6  P4/16
  - [-1, 6, C2f, [512, True]]      # 7
  - [-1, 1, ECABlock, []]          # 8  ← ECA：backbone P4 C2f 后
  - [-1, 1, Conv, [1024, 3, 2]]    # 9  P5/32
  - [-1, 3, C2f, [1024, True]]     # 10
  - [-1, 1, ECABlock, []]          # 11 ← ECA：backbone P5 C2f 后
  - [-1, 1, SPPF, [1024, 5]]       # 12

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 7], 1, Concat, [1]]      # 14 cat backbone P4 (7)
  - [-1, 3, C2f, [512]]            # 15
  - [-1, 1, Conv, [512, 3, 2]]     # 16
  - [[-1, 5], 1, Concat, [1]]      # 17 cat backbone P3 (5)
  - [-1, 3, C2f, [256]]            # 18 P3/8-small
  - [-1, 1, Conv, [256, 3, 2]]     # 19
  - [[-1, 15], 1, Concat, [1]]     # 20 cat head P4 (15)
  - [-1, 3, C2f, [512]]            # 21 P4/16-medium
  - [-1, 1, Conv, [512, 3, 2]]     # 22
  - [[-1, 12], 1, Concat, [1]]     # 23 cat head P5 (12)
  - [-1, 3, C2f, [1024]]           # 24 P5/32-large
  - [[18, 21, 24], 1, Detect, [nc]]  # 25 Detect(P3, P4, P5)
