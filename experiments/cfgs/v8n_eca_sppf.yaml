# I3b：ECA 只插在 SPPF 之后，共 1 处（语义最强的位置）
# 层索引 0-24，Detect 取 17/20/23。width/depth 为 v8n 系数（0.25/0.33）
nc: 8
scales: {}   # 占位防止误用 scales；实际构建时由脚本删除并改用下方顶层系数
width_multiple: 0.25
depth_multiple: 0.33
max_channels: 1024

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1  P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3  P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5  P4/16
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7  P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9
  - [-1, 1, ECABlock, []]          # 10 ← ECA：SPPF 后

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]      # 12 cat backbone P4 (6)
  - [-1, 3, C2f, [512]]            # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14 ← 官方结构：上采样到 stride8（原误写 Conv 下采样）
  - [[-1, 4], 1, Concat, [1]]      # 15 cat backbone P3 (4)
  - [-1, 3, C2f, [256]]            # 16 P3/8-small
  - [-1, 1, Conv, [256, 3, 2]]     # 17
  - [[-1, 13], 1, Concat, [1]]     # 18 cat head P4 (13)
  - [-1, 3, C2f, [512]]            # 19 P4/16-medium
  - [-1, 1, Conv, [512, 3, 2]]     # 20
  - [[-1, 10], 1, Concat, [1]]     # 21 cat head P5 (10)
  - [-1, 3, C2f, [1024]]           # 22 P5/32-large
  - [[16, 19, 22], 1, Detect, [nc]]  # 23 Detect(P3, P4, P5)
